# Corre la suite E2E (Selenium + Cucumber + JUnit 5) y publica el reporte Allure
name: Tests E2E - Automation Exercise

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Instalar Google Chrome (última estable)
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Correr la suite principal en modo headless
        run: >
          mvn -B test
          -Dheadless=true
          -Dcucumber.filter.tags="@alta and not @Manual"

      - name: Generar reporte Allure
        if: always()          # se genera aunque fallen tests
        run: mvn -B allure:report

      - name: Subir reporte Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure
          retention-days: 14

      - name: Subir resultados crudos y reporte de Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tests
          path: |
            target/allure-results
            target/cucumber-reports.html
            target/surefire-reports
          retention-days: 14

      - name: Preparar el reporte para Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure

  # Deja el HTML de Allure servido en Pages, así no hay que bajar el zip
  publicar-reporte:
    needs: e2e-tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    permissions:
      pages: write            # lo pide deploy-pages
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
